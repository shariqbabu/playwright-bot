name: Build & Package Playwright JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub UI se manual "Run workflow" karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fat JAR with Shadow
        run: gradle shadowJar --no-daemon

      - name: Upload Runnable JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bot-jar
          path: build/libs/*-all.jar
          retention-days: 14
